<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扫一扫卡片预览</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #151815;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    .screen {
      width: 640px;
      height: 360px;
      padding: 9px;
      background: #050807;
      color: #eaffea;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .brand {
      color: #40ff5e;
      font-size: 20px;
      line-height: 25px;
      font-weight: 800;
    }
    .timer {
      color: #7f9e86;
      font-size: 10px;
      line-height: 14px;
    }
    .display-frame {
      height: 274px;
      background: transparent;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .secret-card {
      width: 100%;
      height: 274px;
      padding: 16px 18px;
      background: #061009;
      border: 1px solid rgba(64, 255, 94, 0.55);
    }
    .secret-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .secret-badge {
      color: #07110a;
      background: #40ff5e;
      font-size: 10px;
      line-height: 14px;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 800;
    }
    .secret-type {
      color: #40ff5e;
      font-size: 13px;
      line-height: 18px;
      font-weight: 800;
    }
    .secret-title {
      color: #ffffff;
      font-size: 25px;
      line-height: 31px;
      font-weight: 900;
      margin-top: 12px;
    }
    .secret-subtitle {
      color: #9fffae;
      font-size: 13px;
      line-height: 18px;
      margin-top: 3px;
    }
    .secret-divider {
      height: 1px;
      background: rgba(64, 255, 94, 0.35);
      margin-top: 11px;
      margin-bottom: 10px;
    }
    .secret-body {
      color: #ffffff;
      font-size: 20px;
      line-height: 28px;
      font-weight: 800;
    }
    .secret-footnote {
      color: #79b983;
      font-size: 11px;
      line-height: 15px;
      margin-top: 10px;
    }
    .footerbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 22px;
    }
    .footer-hint {
      color: #9fffae;
      font-size: 12px;
      line-height: 17px;
    }
    .copyright {
      color: #5f8f67;
      font-size: 13px;
      line-height: 18px;
      font-weight: 800;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="topbar">
      <div class="brand">扫一扫</div>
      <div class="timer">双击退出</div>
    </div>
    <section class="display-frame">
      <div class="secret-card">
        <div class="secret-top">
          <div class="secret-badge">眼镜专属</div>
          <div class="secret-type">密语</div>
        </div>
        <div class="secret-title">今晚暗号</div>
        <div class="secret-subtitle"></div>
        <div class="secret-divider"></div>
        <div class="secret-body">到吧台说：青柠不要冰</div>
        <div class="secret-footnote">只显示在你的乐奇 AI 眼镜里，一起乐在奇中，奇乐无穷！</div>
      </div>
    </section>
    <div class="footerbar">
      <div class="footer-hint">单击继续扫描 · 双击退出</div>
      <div class="copyright">© 赛博站长</div>
    </div>
  </main>
</body>
</html>
